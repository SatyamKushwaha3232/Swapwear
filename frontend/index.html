<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SwapWear is a premium sustainable marketplace for swapping fashion items safely."
    />
    <title>SwapWear</title>
    <style>
      #swapwear-boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 79, 163, 0.16), transparent 34%),
          linear-gradient(135deg, #fff8fb, #ffffff 48%, #fff4fa);
        color: #070719;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #swapwear-boot-fallback .boot-card {
        width: min(100%, 520px);
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 28px 90px rgba(15, 23, 42, 0.12);
        padding: 34px;
        text-align: center;
        backdrop-filter: blur(22px);
      }

      #swapwear-boot-fallback .boot-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #ff4fa3, #d946ef 58%, #8b5cf6);
        color: white;
        font-size: 30px;
        font-weight: 900;
      }

      #swapwear-boot-fallback h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 48px);
        line-height: 0.95;
        font-weight: 900;
      }

      #swapwear-boot-fallback p {
        margin: 16px auto 0;
        max-width: 390px;
        color: #6a6475;
        font-weight: 700;
        line-height: 1.65;
      }

      #swapwear-boot-fallback button {
        margin-top: 24px;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: #070719;
        color: #ffffff;
        padding: 0 24px;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .swapwear-js-ready #swapwear-boot-fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="swapwear-boot-fallback">
        <div class="boot-card">
          <div class="boot-logo">S</div>
          <h1>Loading SwapWear</h1>
          <p>
            If this stays here, open SwapWear through the dev server at
            http://localhost:5173 instead of opening this HTML file directly.
          </p>
          <button type="button" onclick="window.location.reload()">Refresh app</button>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event && event.target;
          var isResourceError =
            target && (target.tagName === "SCRIPT" || target.tagName === "LINK");

          if (isResourceError) {
            document.documentElement.classList.remove("swapwear-js-ready");
          }
        },
        true
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
